<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tickets | SDP Voice</title>
<style>
  * { box-sizing: border-box; }
  :root { --ink: #172b35; --muted: #61747b; --line: #d5e0df; --teal: #087e78; --coral: #d6533d; }
  body { margin: 0; padding: 28px 18px; color: var(--ink); background: #e8efec; font-family: Arial, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
  .eyebrow { margin: 0 0 6px; color: var(--coral); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  h1 { margin: 0; font: 700 26px Georgia, "Times New Roman", serif; }
  #account { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  button { min-height: 38px; padding: 8px 13px; border: 0; border-radius: 3px; color: #fff; background: var(--teal); font-size: 13px; font-weight: 700; cursor: pointer; }
  button.secondary { color: var(--ink); background: #fff; border: 1px solid var(--line); }
  button.recording { color: #fff; background: var(--coral); border-color: var(--coral); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .columns { display: grid; grid-template-columns: minmax(250px, 0.75fr) minmax(0, 1.6fr); gap: 32px; padding-top: 24px; }
  h2 { margin: 0 0 14px; font: 700 18px Georgia, "Times New Roman", serif; }
  .submit { padding-right: 26px; border-right: 1px solid var(--line); }
  label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 700; }
  textarea { width: 100%; min-height: 145px; resize: vertical; padding: 11px; border: 1px solid var(--line); border-radius: 3px; font: 14px/1.5 Arial, sans-serif; }
  textarea:focus { outline: 2px solid #94cbc5; outline-offset: 1px; }
  .submit button { width: 100%; margin-top: 12px; }
  #message { min-height: 20px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .ticket { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .ticket-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ref { color: var(--teal); font-size: 12px; font-weight: 700; }
  .status { padding: 4px 7px; color: #155d59; background: #d6ebe6; font-size: 11px; font-weight: 700; }
  .status.closed { color: #52646b; background: #dfe5e5; }
  .ticket h3 { margin: 7px 0; font-size: 15px; }
  .description { margin: 0 0 7px; color: var(--ink); font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .details { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .notifications { display: grid; gap: 8px; margin: 12px 0; }
  .notification { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-left: 3px solid var(--coral); background: #fff; font-size: 12px; line-height: 1.45; }
  .notification p { margin: 0; }
  .notification button { flex: 0 0 auto; min-height: 30px; padding: 5px 9px; font-size: 11px; }
  .empty { padding: 24px 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) { .columns { grid-template-columns: 1fr; gap: 24px; } .submit { padding: 0 0 20px; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">SDP Voice · End user</p>
      <h1>My support tickets</h1>
      <p id="account"></p>
    </div>
    <button id="logoutBtn" class="secondary" type="button">Log out</button>
  </header>
  <div class="columns">
    <section class="submit">
      <h2>Submit a ticket</h2>
      <form id="ticketForm">
        <label for="name">Your name</label>
        <input id="name" name="name" required style="width:100%;min-height:40px;padding:9px;border:1px solid var(--line);border-radius:3px;font:14px Arial,sans-serif">
        <label for="text">How can IT help?</label>
        <textarea id="text" name="text" required></textarea>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
          <button id="recordBtn" class="secondary" type="button" aria-pressed="false">Start recording</button>
          <span id="recordStatus" style="color:var(--muted);font-size:12px" aria-live="polite">Stop recording to send your transcript as a ticket.</span>
        </div>
        <button id="submitBtn" type="submit">Send ticket</button>
        <p id="message" role="status"></p>
      </form>
    </section>
    <section>
      <div class="ticket-top">
        <h2>Ticket history</h2>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
      <div id="notifications" class="notifications" aria-live="polite"></div>
      <div id="tickets" aria-live="polite"></div>
    </section>
  </div>
</div>
<script>
const ticketList = document.getElementById('tickets');
const notificationList = document.getElementById('notifications');
const seenNotificationIds = new Set();
const recordBtn = document.getElementById('recordBtn');
const recordStatus = document.getElementById('recordStatus');
const submitBtn = document.getElementById('submitBtn');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let voiceCaptured = false;
let isRecording = false;
let isSubmitting = false;
const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = navigator.language || 'en-US';
  recognition.onstart = () => {
    isRecording = true;
    recordBtn.textContent = 'Stop recording';
    recordBtn.classList.add('recording');
    recordBtn.setAttribute('aria-pressed', 'true');
    recordStatus.textContent = 'Listening... stop when you are done; your ticket will send automatically.';
    submitBtn.disabled = true;
  };
  recognition.onresult = (event) => {
    const transcript = Array.from(event.results)
      .slice(event.resultIndex)
      .map((result) => result[0].transcript.trim())
      .filter(Boolean)
      .join(' ');
    if (transcript) {
      const description = document.getElementById('text');
      description.value = `${description.value.trim()} ${transcript}`.trim();
      voiceCaptured = true;
    }
  };
  recognition.onerror = (event) => {
    recordStatus.textContent = event.error === 'not-allowed'
      ? 'Microphone access was denied. Check browser permissions.'
      : `Voice input stopped: ${event.error}. You can type your issue instead.`;
  };
  recognition.onend = () => {
    isRecording = false;
    recordBtn.textContent = 'Start recording';
    recordBtn.classList.remove('recording');
    recordBtn.setAttribute('aria-pressed', 'false');
    submitBtn.disabled = false;
    if (voiceCaptured) {
      recordStatus.textContent = 'Speech received. Sending ticket...';
      sendTicket();
    }
    else if (recordStatus.textContent.startsWith('Listening')) recordStatus.textContent = 'No speech detected. You can try again.';
  };
  recordBtn.addEventListener('click', () => {
    if (recordBtn.getAttribute('aria-pressed') === 'true') recognition.stop();
    else {
      try {
        recognition.start();
      } catch (error) {
        recordStatus.textContent = 'Voice input could not start. You can type your issue instead.';
      }
    }
  });
} else {
  recordBtn.disabled = true;
  recordStatus.textContent = 'Voice input is not supported by this browser. You can type your issue instead.';
}

function renderTickets(tickets) {
  if (!tickets.length) {
    ticketList.innerHTML = '<p class="empty">No tickets yet.</p>';
    return;
  }
  ticketList.innerHTML = tickets.map((ticket) => `
    <article class="ticket">
      <div class="ticket-top">
        <span class="ref">${escapeHtml(ticket.ref)}</span>
        <span class="status ${ticket.status === 'Closed' ? 'closed' : ''}">${escapeHtml(ticket.status)}</span>
      </div>
      <h3>${escapeHtml(ticket.summary)}</h3>
      <p class="description">${escapeHtml(ticket.raw_text)}</p>
      <p class="details">${escapeHtml(ticket.category)} · ${escapeHtml(ticket.priority)} · ${escapeHtml(new Date(ticket.created_at).toLocaleString())}</p>
    </article>`).join('');
}

async function loadTickets() {
  ticketList.innerHTML = '<p class="empty">Loading tickets...</p>';
  const response = await fetch('/api/tickets');
  if (!response.ok) {
    ticketList.innerHTML = '<p class="empty">Could not load tickets.</p>';
    return;
  }
  renderTickets(await response.json());
}

async function loadNotifications() {
  try {
    const response = await fetch('/api/notifications');
    if (!response.ok) return;
    const notifications = await response.json();
    notifications.forEach((notification) => {
      if (seenNotificationIds.has(notification.id)) return;
      seenNotificationIds.add(notification.id);
      const item = document.createElement('article');
      item.className = 'notification';
      const message = document.createElement('p');
      message.textContent = `${notification.ticket_ref}: ${notification.summary} is now ${notification.status}.`;
      const dismissButton = document.createElement('button');
      dismissButton.type = 'button';
      dismissButton.textContent = 'Dismiss';
      dismissButton.addEventListener('click', async () => {
        const readResponse = await fetch(`/api/notifications/${notification.id}/read`, { method: 'POST' });
        if (readResponse.ok) item.remove();
      });
      item.append(message, dismissButton);
      notificationList.append(item);
    });
  } catch (error) {
    notificationList.setAttribute('aria-label', 'Could not check for status notifications');
  }
}

async function sendTicket() {
  const ticketForm = document.getElementById('ticketForm');
  if (isSubmitting || isRecording || !ticketForm.reportValidity()) return;

  const form = new FormData(ticketForm);
  const message = document.getElementById('message');
  isSubmitting = true;
  submitBtn.disabled = true;
  message.textContent = 'Sending...';
  try {
    const response = await fetch('/api/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: form.get('name'), text: form.get('text'), channel: voiceCaptured ? 'voice' : 'text' })
    });
    const result = await response.json();
    if (!response.ok) {
      message.textContent = result.error || 'Could not submit ticket.';
      return;
    }
    message.textContent = `Ticket ${result.ref} submitted. Summary: ${result.summary}`;
    document.getElementById('text').value = '';
    voiceCaptured = false;
    recordStatus.textContent = 'Microphone ready.';
    await loadTickets();
  } catch (error) {
    message.textContent = 'Could not submit ticket. Please try again.';
  } finally {
    isSubmitting = false;
    submitBtn.disabled = isRecording;
  }
}

document.getElementById('ticketForm').addEventListener('submit', (event) => {
  event.preventDefault();
  sendTicket();
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  loadTickets();
  loadNotifications();
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.assign('/');
});

fetch('/api/session').then((response) => response.json()).then((user) => {
  document.getElementById('account').textContent = `${user.name} · ${user.email}`;
  document.getElementById('name').value = user.name;
});
loadTickets();
loadNotifications();
window.setInterval(loadNotifications, 15000);
</script>
</body>
</html>
