<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | SDP Voice</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; --ink: #172b35; --muted: #61747b; --line: #d5e0df; --teal: #087e78; --coral: #d6533d; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; font-family: Georgia, "Times New Roman", serif; color: var(--ink); background: #e8efec; }
  main { width: min(100%, 430px); padding: 34px; background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--teal); box-shadow: 12px 12px 0 #d4e0dc; }
  .eyebrow { margin: 0 0 10px; color: var(--coral); font: 700 11px/1.2 Arial, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 30px; }
  .intro { margin: 8px 0 26px; color: var(--muted); font: 14px/1.5 Arial, sans-serif; }
  label { display: block; margin: 15px 0 6px; font: 700 12px Arial, sans-serif; }
  input { width: 100%; min-height: 42px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; font: 14px Arial, sans-serif; }
  input:focus { outline: 2px solid #94cbc5; outline-offset: 1px; }
  button { width: 100%; min-height: 44px; margin-top: 22px; border: 0; border-radius: 3px; color: #fff; background: var(--teal); font: 700 14px Arial, sans-serif; cursor: pointer; }
  button:hover { background: #066b66; }
  #message { min-height: 20px; margin: 12px 0 0; color: #a53326; font: 13px/1.4 Arial, sans-serif; }
  @media (max-width: 480px) { main { padding: 26px 22px; box-shadow: 7px 7px 0 #d4e0dc; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">SDP Voice · Service Desk</p>
  <h1>Sign in</h1>
  <p class="intro">Sign in to access your tickets.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Continue</button>
    <p id="message" role="alert"></p>
  </form>
</main>
<script>
document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = document.getElementById('message');
  const form = new FormData(event.currentTarget);
  const response = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: form.get('email'), password: form.get('password') })
  });
  const result = await response.json();
  if (!response.ok) {
    message.textContent = result.error || 'Unable to sign in.';
    return;
  }
  window.location.assign('/');
});
</script>
</body>
</html>
