<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technician Insights | SDP Voice</title>
<style>
  * { box-sizing: border-box; }
  :root { --ink: #172b35; --muted: #61747b; --line: #d5e0df; --teal: #087e78; --coral: #d6533d; --surface: #fff; }
  body { margin: 0; padding: 28px 18px; color: var(--ink); background: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
  .eyebrow { margin: 0 0 5px; color: var(--coral); font-size: 11px; font-weight: 700; text-transform: uppercase; }
  h1 { margin: 0; font: 700 24px Georgia, "Times New Roman", serif; }
  .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 8px; }
  button, .nav-link { min-height: 36px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--surface); font: 600 12px Arial, sans-serif; text-decoration: none; cursor: pointer; }
  button.primary { border-color: var(--teal); color: #fff; background: var(--teal); }
  button:disabled { opacity: .6; cursor: wait; }
  .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; margin: 24px 0 12px; }
  h2 { margin: 0; font: 700 17px Georgia, "Times New Roman", serif; }
  .updated { color: var(--muted); font-size: 11px; }
  .metrics { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); }
  .metric { min-height: 100px; padding: 16px; border-right: 1px solid var(--line); }
  .metric:last-child { border-right: 0; }
  .metric-label { display: block; color: var(--muted); font-size: 11px; }
  .metric-value { display: block; margin-top: 9px; font: 700 30px Georgia, "Times New Roman", serif; }
  .metric.alert .metric-value { color: var(--coral); }
  .insight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 18px 0 0; }
  .trend-section { min-width: 0; }
  .trend-list { display: grid; gap: 12px; padding-top: 12px; }
  .trend-row { display: grid; grid-template-columns: minmax(95px, 150px) minmax(40px, 1fr) 32px; align-items: center; gap: 10px; font-size: 12px; }
  .trend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 9px; overflow: hidden; background: #e4eae9; }
  .bar-fill { height: 100%; background: var(--teal); }
  .trend-count { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .summary-section { margin-top: 28px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .summary-section p { margin: 9px 0 0; max-width: 850px; color: #344b52; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .summary-actions { display: flex; align-items: center; gap: 12px; }
  #summaryMode { color: var(--muted); font-size: 11px; }
  .empty { padding: 18px 0; color: var(--muted); font-size: 13px; }
  @media (max-width: 760px) {
    body { padding: 20px 14px; }
    header { align-items: flex-start; flex-direction: column; }
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .metric:nth-child(2n) { border-right: 0; }
    .metric:last-child { grid-column: 1 / -1; border-bottom: 0; }
    .insight-grid { grid-template-columns: 1fr; gap: 22px; }
    .summary-actions { align-items: flex-start; flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">SDP Voice / IT Support</p>
      <h1>Ticket insights</h1>
      <p class="subtitle">Queue volume, urgency, and recurring categories across all tickets.</p>
    </div>
    <nav aria-label="Technician navigation">
      <a class="nav-link" href="/">Tickets</a>
      <button id="refreshBtn" type="button">Refresh</button>
      <button id="logoutBtn" type="button">Log out</button>
    </nav>
  </header>

  <section aria-labelledby="volumeTitle">
    <div class="section-heading">
      <h2 id="volumeTitle">Queue volume</h2>
      <span id="updatedAt" class="updated"></span>
    </div>
    <div class="metrics" id="metrics" aria-live="polite"></div>
  </section>

  <div class="insight-grid">
    <section class="trend-section" aria-labelledby="categoriesTitle">
      <h2 id="categoriesTitle">Common categories</h2>
      <div id="categories" class="trend-list"></div>
    </section>
    <section class="trend-section" aria-labelledby="prioritiesTitle">
      <h2 id="prioritiesTitle">Priority distribution</h2>
      <div id="priorities" class="trend-list"></div>
    </section>
  </div>

  <section class="summary-section" aria-labelledby="summaryTitle">
    <div class="summary-actions">
      <h2 id="summaryTitle">Queue summary</h2>
      <button id="summaryBtn" class="primary" type="button">Generate summary</button>
      <span id="summaryMode"></span>
    </div>
    <p id="summaryText">Generate a quick summary of the current queue.</p>
  </section>
</div>
<script>
const metricsElement = document.getElementById('metrics');
const categoriesElement = document.getElementById('categories');
const prioritiesElement = document.getElementById('priorities');
const summaryButton = document.getElementById('summaryBtn');
const summaryText = document.getElementById('summaryText');
const summaryMode = document.getElementById('summaryMode');

function renderMetrics(data) {
  const metrics = [
    { label: 'Total tickets', value: data.total },
    { label: 'Open + in progress', value: data.open },
    { label: 'Resolved', value: data.resolved },
    { label: 'Closed', value: data.closed },
    { label: 'High / urgent', value: data.urgent_or_high, alert: true }
  ];
  metricsElement.replaceChildren();
  metrics.forEach(metric => {
    const item = document.createElement('div');
    item.className = `metric${metric.alert ? ' alert' : ''}`;
    const label = document.createElement('span');
    label.className = 'metric-label';
    label.textContent = metric.label;
    const value = document.createElement('strong');
    value.className = 'metric-value';
    value.textContent = metric.value;
    item.append(label, value);
    metricsElement.append(item);
  });
}

function renderTrends(container, rows) {
  container.replaceChildren();
  if (!rows.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = 'No tickets yet.';
    container.append(empty);
    return;
  }
  const max = Math.max(...rows.map(row => row.count), 1);
  rows.forEach(row => {
    const item = document.createElement('div');
    item.className = 'trend-row';
    const name = document.createElement('span');
    name.className = 'trend-name';
    name.textContent = row.category || row.priority;
    const track = document.createElement('div');
    track.className = 'bar-track';
    track.setAttribute('role', 'progressbar');
    track.setAttribute('aria-valuenow', row.count);
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', max);
    track.setAttribute('aria-label', `${name.textContent}: ${row.count} tickets`);
    const fill = document.createElement('div');
    fill.className = 'bar-fill';
    fill.style.width = `${Math.round(row.count / max * 100)}%`;
    track.append(fill);
    const count = document.createElement('span');
    count.className = 'trend-count';
    count.textContent = row.count;
    item.append(name, track, count);
    container.append(item);
  });
}

async function loadInsights() {
  metricsElement.innerHTML = '<p class="empty">Loading ticket metrics...</p>';
  const response = await fetch('/api/technician/insights');
  if (!response.ok) {
    metricsElement.innerHTML = '<p class="empty">Could not load ticket metrics.</p>';
    return;
  }
  const data = await response.json();
  renderMetrics(data);
  renderTrends(categoriesElement, data.categories);
  renderTrends(prioritiesElement, data.priorities);
  document.getElementById('updatedAt').textContent = `Updated ${new Date().toLocaleTimeString()}`;
}

document.getElementById('refreshBtn').addEventListener('click', loadInsights);
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.assign('/');
});
summaryButton.addEventListener('click', async () => {
  summaryButton.disabled = true;
  summaryText.textContent = 'Summarizing the current ticket counts...';
  summaryMode.textContent = '';
  try {
    const response = await fetch('/api/technician/insights/summary', { method: 'POST' });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Could not generate the summary.');
    summaryText.textContent = result.summary;
    summaryMode.textContent = result.mode === 'anthropic' ? 'AI summary' : 'Local summary · no API call';
  } catch (error) {
    summaryText.textContent = error.message;
  } finally {
    summaryButton.disabled = false;
  }
});

loadInsights();
</script>
</body>
</html>
